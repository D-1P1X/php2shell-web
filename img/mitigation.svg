<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="Schéma doporučených kroků ochrany">
  <rect width="1000" height="340" fill="#010401"/>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#010401">
    <rect x="60" y="130" width="200" height="90" rx="12" fill="#33ff33"/>
    <text x="160" y="170" text-anchor="middle" font-weight="700">1. Aktualizovat PHP</text>
    <text x="160" y="195" text-anchor="middle" font-size="12">8.2.35 / 8.3.36 / 8.4.27 / 8.5.12</text>

    <rect x="310" y="130" width="200" height="90" rx="12" fill="#1fae1f"/>
    <text x="410" y="170" text-anchor="middle" font-weight="700">2. Restartovat</text>
    <text x="410" y="195" text-anchor="middle" font-size="12">web server a PHP-FPM</text>

    <rect x="560" y="130" width="200" height="90" rx="12" fill="#1fae1f"/>
    <text x="660" y="170" text-anchor="middle" font-weight="700">3. Rotovat klíče</text>
    <text x="660" y="195" text-anchor="middle" font-size="12">tokeny, hesla, session klíče</text>

    <rect x="810" y="130" width="140" height="90" rx="12" fill="#2a8f2a"/>
    <text x="880" y="170" text-anchor="middle" font-weight="700">4. Monitorovat</text>
    <text x="880" y="195" text-anchor="middle" font-size="12">logy serveru</text>
  </g>
  <g stroke="#0f3d0f" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="260" y1="175" x2="305" y2="175"/>
    <line x1="510" y1="175" x2="555" y2="175"/>
    <line x1="760" y1="175" x2="805" y2="175"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f3d0f"/>
    </marker>
  </defs>
  <text x="500" y="50" fill="#33ff33" font-family="JetBrains Mono, Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle">Postup zmírnění rizika</text>
</svg>
